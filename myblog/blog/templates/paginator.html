{% load blog_extras %}
{% if page.paginator.num_pages > 1 %}
<div class="pagination">
    <span class="step-links">
        {% if page.has_previous %}
            <a href="{% page_url request page.previous_page_number %}">Предыдущая</a>
        {% endif %}
        <span class="current">
            Страница {{ page.number }} из {{ page.paginator.num_pages }}.
        </span>
        {% if page.has_next %}
            <a href="{% page_url request page.next_page_number %}">Следующая</a>
        {% endif %}
    </span>
</div>
{% endif %}
